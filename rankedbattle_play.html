<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Deckforge Arena — Ranked Match</title>

  <style>
    :root{
      --bg0:#070a12; --bg1:#0b1020; --text:#eaf0ff; --muted: rgba(234,240,255,.72);
      --primary:#7c5cff; --primary2:#23d5ff; --good:#3dffb7; --bad:#ff5577; --shadow: 0 18px 60px rgba(0,0,0,.45);
      --r14:14px; --r18:18px; --r22:22px; --r26:26px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      --max: 1280px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; font-family:var(--sans); color:var(--text);
      background:
        radial-gradient(1200px 800px at 25% 10%, rgba(124,92,255,.16), transparent 55%),
        radial-gradient(1200px 800px at 80% 20%, rgba(35,213,255,.13), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }
    .container{ width:min(var(--max), calc(100% - 40px)); margin-inline:auto; }
    .nav{ position:sticky; top:0; z-index:10; backdrop-filter: blur(14px); background: rgba(7,10,18,.45); border-bottom: 1px solid rgba(255,255,255,.08); }
    .nav__inner{ display:flex; align-items:center; justify-content:space-between; padding:16px 0; gap:14px; flex-wrap:wrap; }
    .brand{ display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }
    .brand__mark{ width:36px; height:36px; border-radius:12px; display:grid; place-items:center; font-weight:1000; background: linear-gradient(135deg, rgba(124,92,255,.9), rgba(35,213,255,.75)); box-shadow: 0 10px 28px rgba(124,92,255,.22); }
    .brand__name{ font-weight:1000; }
    .nav__right{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .chip{ padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); font-weight: 900; font-size: 13px; display:inline-flex; gap:8px; align-items:center; }
    .chip b{ font-family:var(--mono); }
    .btn{ border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: var(--text); padding: 10px 14px; border-radius: 14px; font-weight: 1000; cursor:pointer; transition: transform .15s ease, background .15s ease; text-decoration:none; }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.09); }
    .btn--primary{ border-color: rgba(124,92,255,.55); background: linear-gradient(135deg, rgba(124,92,255,.95), rgba(35,213,255,.70)); box-shadow: 0 16px 46px rgba(124,92,255,.22); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
    .wrap{ padding: 18px 0 46px; }
    h1{ margin:0; font-size: clamp(22px, 3vw, 36px); letter-spacing:-.6px; }
    .sub{ margin: 10px 0 0; color: var(--muted); line-height:1.6; max-width: 110ch; }

    .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    @media (max-width: 980px){ .grid2{ grid-template-columns:1fr; } }

    .panel{ border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); border-radius: var(--r26); box-shadow: var(--shadow); overflow:hidden; }
    .panel__head{ padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:space-between; gap: 10px; background: rgba(0,0,0,.12); flex-wrap:wrap; }
    .panel__title{ font-weight: 1000; display:flex; align-items:center; gap: 10px; }
    .dot{ width:10px; height:10px; border-radius:999px; background: var(--good); box-shadow: 0 0 0 5px rgba(61,255,183,.10); }
    .panel__body{ padding: 12px 14px 14px; }

    .pill{ font-family: var(--mono); font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(7,10,18,.25); color: rgba(234,240,255,.90); display:inline-flex; align-items:center; gap: 8px; user-select:none; }

    .arena{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 980px){ .arena{ grid-template-columns:1fr; } }

    .cardStage{ border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); border-radius: 22px; overflow:hidden; display:flex; flex-direction:column; min-height: 360px; }
    .cardStage__top{ display:flex; align-items:center; justify-content:space-between; gap: 10px; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.12); }
    .who{ font-weight:1000; letter-spacing:-.2px; }

    .imgBox{ height: 240px; background: rgba(0,0,0,.18); border-bottom: 1px solid rgba(255,255,255,.08); display:grid; place-items:center; position:relative; }
    .imgBox img{ width: 100%; height: 100%; object-fit: contain; background: rgba(0,0,0,.16); }
    .fallback{ position:absolute; inset:0; display:grid; place-items:center; font-family: var(--mono); color: rgba(234,240,255,.75); pointer-events:none; }

    .stats{ padding: 10px 12px 12px; display:grid; gap: 8px; }
    .statRow{ display:flex; align-items:center; justify-content:space-between; gap: 10px; border: 1px solid rgba(255,255,255,.10); background: rgba(0,0,0,.12); border-radius: 14px; padding: 9px 10px; }
    .statRow b{ font-family: var(--mono); }
    .statRow button{ border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: var(--text); padding: 8px 10px; border-radius: 12px; font-weight: 1000; cursor:pointer; }
    .statRow button:hover{ background: rgba(255,255,255,.10); }
    .statRow button:disabled{ opacity:.55; cursor:not-allowed; }

    .log{ border:1px solid rgba(255,255,255,.10); background: rgba(0,0,0,.14); border-radius: 18px; padding: 10px; max-height: 320px; overflow:auto; font-family: var(--mono); font-size: 12px; color: rgba(234,240,255,.80); white-space: pre-wrap; line-height: 1.5; }

    .bigScore{ display:flex; gap: 10px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .scoreBox{ border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); border-radius: 18px; padding: 10px 12px; display:flex; align-items:center; gap: 10px; flex: 1 1 220px; min-width: 220px; }
    .scoreBox .name{ font-weight:1000; }
    .scoreBox .score{ margin-left:auto; font-family: var(--mono); font-weight:1000; font-size: 18px; }

    .banner{ padding: 10px 12px; border-radius: 18px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: rgba(234,240,255,.86); line-height: 1.5; }

    .toast{ position:fixed; left:50%; transform: translateX(-50%); bottom: 18px; padding: 10px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.14); background: rgba(15,18,30,.92); backdrop-filter: blur(14px); box-shadow: var(--shadow); color: rgba(234,240,255,.92); display:none; z-index:200; max-width: min(980px, calc(100% - 40px)); white-space:pre-wrap; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body>
<header class="nav">
  <div class="nav__inner container">
    <a class="brand" href="index.html">
      <span class="brand__mark">?</span>
      <span class="brand__name">Deckforge Arena</span>
    </a>

    <div class="nav__right">
      <div class="chip">You: <b id="meName">—</b></div>
      <div class="chip">Match: <b id="matchIdLabel">—</b></div>
      <a class="btn" href="play.html">Back to Play</a>
    </div>
  </div>
</header>

<main class="container wrap">
  <h1>Ranked Match</h1>
  <p class="sub" id="subLine">Loading match…</p>

  <div class="panel" style="margin-top:14px;">
    <div class="panel__head">
      <div class="panel__title"><span class="dot"></span> Scoreboard</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <span class="pill" id="turnPill">Turn —</span>
        <span class="pill" id="phasePill">Phase —</span>
      </div>
    </div>
    <div class="panel__body">
      <div class="bigScore">
        <div class="scoreBox"><span class="name" id="hostName">Host</span><span class="score" id="hostScore">0</span></div>
        <div class="scoreBox"><span class="name" id="guestName">Guest</span><span class="score" id="guestScore">0</span></div>
      </div>
      <div class="banner" style="margin-top:12px;" id="statusBanner">Loading…</div>
    </div>
  </div>

  <div class="grid2" style="margin-top:14px;">
    <section class="panel">
      <div class="panel__head">
        <div class="panel__title"><span class="dot"></span> Arena</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn" id="btnNext" disabled>Next Turn (Host)</button>
        </div>
      </div>
      <div class="panel__body">
        <div class="arena">
          <div class="cardStage">
            <div class="cardStage__top">
              <div class="who" id="meLabel">You</div>
              <span class="pill" id="meDeckLabel">deck: —</span>
            </div>
            <div class="imgBox">
              <img id="meCardImg" alt="Your card"/>
              <div class="fallback" id="meFallback">loading…</div>
            </div>
            <div class="stats" id="meStats"></div>
          </div>

          <div class="cardStage">
            <div class="cardStage__top">
              <div class="who" id="oppLabel">Opponent</div>
              <span class="pill" id="oppDeckLabel">deck: —</span>
            </div>
            <div class="imgBox">
              <img id="oppCardImg" alt="Opponent card"/>
              <div class="fallback" id="oppFallback">loading…</div>
            </div>
            <div class="stats" id="oppStats"></div>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="panel__head">
        <div class="panel__title"><span class="dot"></span> Battle Log</div>
        <span class="pill" id="rolePill">role: —</span>
      </div>
      <div class="panel__body">
        <div class="log" id="logBox">—</div>
      </div>
    </aside>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDJHl2yCKbiiinesOZ9R_SROC51knmT9TQ",
    authDomain: "goamica-7190c.firebaseapp.com",
    databaseURL: "https://goamica-7190c-default-rtdb.firebaseio.com",
    projectId: "goamica-7190c",
    storageBucket: "goamica-7190c.firebasestorage.app",
    messagingSenderId: "612907093027",
    appId: "1:612907093027:web:2b7106adc9ba6b7b177596",
    measurementId: "G-8DE8ST7LXR"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function getParam(name){ return new URL(window.location.href).searchParams.get(name); }
  function getSession(){
    const id = localStorage.getItem("amica_currentUserId") || sessionStorage.getItem("amica_currentUserId");
    const user = localStorage.getItem("amica_currentUser") || sessionStorage.getItem("amica_currentUser");
    return { id, user: user ? JSON.parse(user) : null };
  }

  const toastEl = document.getElementById("toast");
  let toastTimer=null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.style.display="none", 2600);
  }

  const session = getSession();
  if(!session.id || !session.user){ window.location.href = "login.html"; }

  const userId = String(session.id);
  document.getElementById("meName").textContent = session.user.Username || "—";

  const matchId = String(getParam("matchId") || "");
  if(!matchId){ alert("Missing matchId"); window.location.href="play.html"; }
  document.getElementById("matchIdLabel").textContent = matchId;

  const matchRef = db.ref(`RankedMatches/${matchId}`);

  const btnNext = document.getElementById("btnNext");
  const meCardImg = document.getElementById("meCardImg");
  const oppCardImg = document.getElementById("oppCardImg");
  const meFallback = document.getElementById("meFallback");
  const oppFallback = document.getElementById("oppFallback");

  function setLog(text){ document.getElementById("logBox").textContent = text || "—"; }
  function setBanner(text){ document.getElementById("statusBanner").textContent = text; }
  function setTurnPill(t){ document.getElementById("turnPill").textContent = `Turn ${t}`; }
  function setPhasePill(p){ document.getElementById("phasePill").textContent = `Phase: ${p}`; }
  function setScores(h,g){
    document.getElementById("hostScore").textContent = String(h||0);
    document.getElementById("guestScore").textContent = String(g||0);
  }
  function setNames(hn,gn){
    document.getElementById("hostName").textContent = hn || "Host";
    document.getElementById("guestName").textContent = gn || "Guest";
  }
  function setRolePill(r){ document.getElementById("rolePill").textContent = `role: ${r}`; }

  // ? MUST match your card IDs from deck editor
  const CARD_CATALOG = [
    {id:"HUM_001", name:"Human Warrior"},
    {id:"HUM_002", name:"Human Farmer"},
    {id:"HUM_003", name:"Human Archer"},
    {id:"HUM_004", name:"Human Wizard"},
    {id:"HUM_005", name:"Human Elder Wizard"},
    {id:"HUM_006", name:"Human Cleric"},
    {id:"HUM_007", name:"Human Knight"},
    {id:"HUM_008", name:"Human Lancer"},
    {id:"HUM_009", name:"Human Blacksmith"},
    {id:"HUM_010", name:"Human Astrologer"},

    {id:"SKL_001", name:"Skeleton Warrior"},
    {id:"SKL_002", name:"Skeleton Knight"},
    {id:"SKL_003", name:"Skeleton Archer"},
    {id:"SKL_004", name:"Skeleton Wizard"},
    {id:"SKL_005", name:"Skeleton Elder Wizard"},
    {id:"SKL_006", name:"Skeleton Cleric"},
    {id:"SKL_007", name:"Skeleton Lancer"},
    {id:"SKL_008", name:"Skeleton Blacksmith"},
    {id:"SKL_009", name:"Skeleton Assassin"},
    {id:"SKL_010", name:"Skeleton Warden"},

    {id:"DEM_001", name:"Demon Imp"},
    {id:"DEM_002", name:"Demon Brute"},
    {id:"DEM_003", name:"Demon Hellhound"},
    {id:"DEM_004", name:"Demon Warlock"},
    {id:"DEM_005", name:"Demon Succubus"},
    {id:"DEM_006", name:"Demon Infernal Knight"},
    {id:"DEM_007", name:"Demon Flame Lancer"},
    {id:"DEM_008", name:"Demon Ash Archer"},
    {id:"DEM_009", name:"Demon Elder Warlock"},
    {id:"DEM_010", name:"Demon Lord’s Herald"},

    {id:"ICE_001", name:"Ice Dwarf Miner"},
    {id:"ICE_002", name:"Ice Dwarf Shieldbearer"},
    {id:"ICE_003", name:"Ice Dwarf Axeguard"},
    {id:"ICE_004", name:"Ice Dwarf Runecaster"},
    {id:"ICE_005", name:"Ice Dwarf Frost Archer"},
    {id:"ICE_006", name:"Ice Dwarf Engineer"},
    {id:"ICE_007", name:"Ice Dwarf Hammer Knight"},
    {id:"ICE_008", name:"Ice Dwarf Glacier Lancer"},
    {id:"ICE_009", name:"Ice Dwarf Elder Runelord"},
    {id:"ICE_010", name:"Ice Dwarf Warden"},
  ];
  const CARD_BY_ID = Object.fromEntries(CARD_CATALOG.map(c => [c.id, c]));
  const imgPathById = (cardId) => {
    const c = CARD_BY_ID[cardId];
    return c ? `images/${c.name}.png` : "";
  };

  function seededNumber(seedStr, min, max){
    let h = 2166136261;
    for(let i=0;i<seedStr.length;i++){
      h ^= seedStr.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    const rnd = (h >>> 0) / 4294967295;
    return Math.floor(min + rnd * (max - min + 1));
  }
  function cardStats(cardId){
    return {
      power:  seededNumber(cardId+"p", 40, 100),
      defense:seededNumber(cardId+"d", 35, 95),
      speed:  seededNumber(cardId+"s", 30, 100),
      magic:  seededNumber(cardId+"m", 20, 100),
      luck:   seededNumber(cardId+"l", 10, 100)
    };
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function phaseOf(m){ return (m && m.phase) ? m.phase : "picking"; }
  function stateOf(m){ return (m && m.state) ? m.state : "battle"; }

  async function appendLog(line){
    const logRef = matchRef.child("log");
    const snap = await logRef.once("value");
    const text = snap.val() || "";
    await logRef.set((text ? text + "\n" : "") + line);
  }

  // ? Robust deck loader (tries multiple paths)
  async function tryLoadDeckAtPath(basePath){
    const snap = await db.ref(basePath).once("value");
    const data = snap.val();
    if(!data) return null;

    // common keys we used
    const selected = data.selectedDeckKey || data.defaultDeckKey || data.SelectedDeckKey || data.DefaultDeckKey || data.selectedDeck || data.DefaultDeck;
    if(!selected) return null;

    const deckNode = data[selected] || data.decks?.[selected] || data.Decks?.[selected];
    const cards = deckNode?.cards || deckNode?.Cards || deckNode;
    if(!Array.isArray(cards)) return null;

    const deck = cards.filter(Boolean).slice(0,10);
    if(deck.length !== 10) return null;

    return { deckKey: selected, deckCards: deck };
  }

  async function loadPlayerDeck(uid){
    const candidates = [
      `Decks/${uid}`,                 // original expected
      `Account/${uid}/Decks`,         // if you stored under account
      `Account/${uid}/decks`,
      `Account/${uid}`,               // sometimes decks live directly under account
      `Players/${uid}/Decks`,
      `Users/${uid}/Decks`
    ];

    for(const p of candidates){
      const got = await tryLoadDeckAtPath(p);
      if(got) return got;
    }

    // last fallback: if account stores DefaultDeck as a key and decks under Account/<uid>/DeckList/<key>
    const accSnap = await db.ref(`Account/${uid}`).once("value");
    const acc = accSnap.val() || {};
    const fallbackKey = acc.DefaultDeck || acc.defaultDeckKey || acc.selectedDeckKey || acc.SelectedDeckKey;
    if(fallbackKey){
      const dSnap = await db.ref(`Account/${uid}/DeckList/${fallbackKey}/cards`).once("value");
      const cards = dSnap.val();
      if(Array.isArray(cards) && cards.filter(Boolean).slice(0,10).length === 10){
        return { deckKey: fallbackKey, deckCards: cards.filter(Boolean).slice(0,10) };
      }
    }

    return null;
  }

  function renderMyStats(cardId, disabled, chooseFn){
    const stats = cardStats(cardId);
    const wrap = document.getElementById("meStats");
    wrap.innerHTML = "";
    Object.keys(stats).forEach((k) => {
      const row = document.createElement("div");
      row.className = "statRow";
      row.innerHTML = `
        <span style="text-transform:uppercase; letter-spacing:.9px; font-size:12px; color:rgba(234,240,255,.75);">${k}</span>
        <b>${stats[k]}</b>
        <button ${disabled ? "disabled" : ""}>choose</button>
      `;
      row.querySelector("button").addEventListener("click", () => chooseFn(k));
      wrap.appendChild(row);
    });
  }

  function renderOppStats(cardId){
    const stats = cardStats(cardId);
    const wrap = document.getElementById("oppStats");
    wrap.innerHTML = "";
    Object.keys(stats).forEach((k) => {
      const row = document.createElement("div");
      row.className = "statRow";
      row.innerHTML = `
        <span style="text-transform:uppercase; letter-spacing:.9px; font-size:12px; color:rgba(234,240,255,.75);">${k}</span>
        <b>${stats[k]}</b>
        <span class="pill" style="opacity:.75;">—</span>
      `;
      wrap.appendChild(row);
    });
  }

  let match=null;
  let hostId=null, guestId=null, isHost=false, oppUid=null;
  let myDeckKey=null, oppDeckKey=null, myDeck=[], oppDeck=[];
  let decksLoaded=false;

  function myPick(m,t){ return m?.picks?.[String(t)]?.[userId] || null; }
  function oppPick(m,t){ return m?.picks?.[String(t)]?.[oppUid] || null; }
  function turnState(m,t){ return m?.current?.[String(t)] || null; }

  function canChoose(m){
    if(phaseOf(m) !== "picking") return false;
    const t = m.turn || 1;
    return !myPick(m,t);
  }

  async function ensureShuffles(m){
    if(!isHost) return;
    if(m?.shuffles?.host?.length === 10 && m?.shuffles?.guest?.length === 10) return;
    if(!decksLoaded) return;

    await matchRef.child("shuffles").set({
      host: shuffle(myDeck),
      guest: shuffle(oppDeck),
      createdAt: Date.now()
    });
    await appendLog("[system] host generated shuffles");
  }

  async function chooseStat(statKey){
    if(!match) return;
    if(!canChoose(match)) return toast("You cannot choose right now.");
    const t = match.turn || 1;
    await matchRef.child(`picks/${t}/${userId}`).set(statKey);
    await appendLog(`[turn ${t}] ${session.user.Username} chose ${statKey.toUpperCase()}`);
  }

  async function resolveIfReady(m){
    if(!isHost) return;
    if(phaseOf(m) !== "picking") return;

    const t = m.turn || 1;
    const hostPick = m?.picks?.[String(t)]?.[hostId] || null;
    const guestPick = m?.picks?.[String(t)]?.[guestId] || null;
    if(!hostPick || !guestPick) return;

    const sh = m.shuffles || {};
    const hostCards = sh.host || [];
    const guestCards = sh.guest || [];
    if(hostCards.length !== 10 || guestCards.length !== 10) return;

    const hostCardId = hostCards[t-1];
    const guestCardId = guestCards[t-1];

    const hStats = cardStats(hostCardId);
    const gStats = cardStats(guestCardId);

    const owner = (t % 2 === 1) ? "host" : "guest";
    const usedStat = (owner === "host") ? hostPick : guestPick;

    const a = hStats[usedStat];
    const b = gStats[usedStat];

    let winner="draw";
    if(a>b) winner="host";
    else if(b>a) winner="guest";

    const scoreHost = (m.scoreHost||0) + (winner==="host"?1:0);
    const scoreGuest = (m.scoreGuest||0) + (winner==="guest"?1:0);

    const res = { usedStat, hostCardId, guestCardId, hostPick, guestPick, hostValue:a, guestValue:b, winner, resolvedAt: Date.now() };
    const maxT = m.maxTurns || 10;

    await matchRef.update({
      [`current/${t}`]: res,
      scoreHost, scoreGuest,
      phase: (t>=maxT) ? "ended" : "resolved",
      ...(t>=maxT ? { endedAt: Date.now() } : {})
    });

    const wText = (winner==="draw") ? "DRAW" : (winner==="host" ? m.hostName : m.guestName);
    await appendLog(`[turn ${t}] STAT=${usedStat.toUpperCase()} | ${m.hostName} ${a} vs ${m.guestName} ${b} => ${wText}`);
  }

  async function nextTurn(){
    if(!match) return;
    if(!isHost) return toast("Only host can advance.");
    if(phaseOf(match) !== "resolved") return toast("Finish current turn first.");

    const t = match.turn || 1;
    const maxT = match.maxTurns || 10;
    if(t>=maxT) return toast("Match ended.");

    await matchRef.update({ turn: t+1, phase:"picking" });
    await appendLog(`[system] advancing to turn ${t+1}`);
  }
  btnNext.addEventListener("click", nextTurn);

  function render(m){
    match = m;

    // if somehow state flipped back, protect:
    if(stateOf(m) !== "battle"){
      setBanner("Match not in battle state. Returning to lobby…");
      setTimeout(()=> window.location.href=`rankedbattle.html?matchId=${encodeURIComponent(matchId)}`, 800);
      return;
    }

    const ph = phaseOf(m);
    const t = m.turn || 1;

    document.getElementById("subLine").textContent = decksLoaded ? "Battle live." : "Loading decks…";
    setTurnPill(t);
    setPhasePill(ph);
    setNames(m.hostName, m.guestName);
    setScores(m.scoreHost||0, m.scoreGuest||0);
    setLog(m.log || "—");

    btnNext.disabled = !isHost || (ph !== "resolved");

    document.getElementById("meDeckLabel").textContent = `deck: ${myDeckKey||"—"}`;
    document.getElementById("oppDeckLabel").textContent = `deck: ${oppDeckKey||"—"}`;

    const sh = m.shuffles || {};
    const hostCards = sh.host || [];
    const guestCards = sh.guest || [];
    const haveShuffles = (hostCards.length===10 && guestCards.length===10);

    const myIsHost = (userId === hostId);
    let myCardId=null, oppCardId=null;

    if(haveShuffles){
      myCardId = myIsHost ? hostCards[t-1] : guestCards[t-1];
      oppCardId = myIsHost ? guestCards[t-1] : hostCards[t-1];
    }

    if(myCardId){
      meFallback.textContent = "";
      meCardImg.src = imgPathById(myCardId) || "";
      renderMyStats(myCardId, !canChoose(m), chooseStat);
    } else {
      meFallback.textContent = decksLoaded ? "waiting…" : "loading deck…";
      meCardImg.removeAttribute("src");
      document.getElementById("meStats").innerHTML = "";
    }

    if(oppCardId){
      oppFallback.textContent = "";
      oppCardImg.src = imgPathById(oppCardId) || "";
      renderOppStats(oppCardId);
    } else {
      oppFallback.textContent = decksLoaded ? "waiting…" : "loading deck…";
      oppCardImg.removeAttribute("src");
      document.getElementById("oppStats").innerHTML = "";
    }

    if(!decksLoaded){
      setBanner("Decks not loaded yet…");
      return;
    }

    if(ph==="picking"){
      const ownerName = (t%2===1) ? m.hostName : m.guestName;
      const mp = myPick(m,t);
      const op = oppPick(m,t);

      if(!mp && !op) setBanner(`Choose a stat. Turn owner: ${ownerName}`);
      else if(mp && !op) setBanner(`You chose ${mp.toUpperCase()}. Waiting for opponent…`);
      else if(!mp && op) setBanner(`Opponent chose. Your move…`);
      else setBanner("Both chosen. Resolving…");
    } else if(ph==="resolved"){
      const ts = turnState(m,t);
      if(ts){
        const w = ts.winner;
        const wText = (w==="draw") ? "DRAW" : (w==="host" ? m.hostName : m.guestName);
        setBanner(`Turn ${t} resolved — STAT ${ts.usedStat.toUpperCase()} — Winner: ${wText}`);
      } else setBanner("Resolved. Waiting for host…");
    } else if(ph==="ended"){
      const h=m.scoreHost||0, g=m.scoreGuest||0;
      const w = (h===g) ? "DRAW" : (h>g ? m.hostName : m.guestName);
      setBanner(`Match ended. Winner: ${w}. Final score ${h} - ${g}`);
    } else {
      setBanner("Loading…");
    }
  }

  async function init(){
    document.getElementById("subLine").textContent = "Connecting to match…";

    const snap = await matchRef.once("value");
    const m = snap.val();
    if(!m){ alert("Match not found."); window.location.href="play.html"; return; }

    hostId = String(m.hostId);
    guestId = String(m.guestId);
    isHost = (userId === hostId);
    oppUid = isHost ? guestId : hostId;

    document.getElementById("meLabel").textContent = `You (${isHost?"host":"guest"})`;
    document.getElementById("oppLabel").textContent = "Opponent";
    setRolePill(isHost ? "host" : "guest");

    // load decks (robust)
    const myLoaded = await loadPlayerDeck(userId);
    const oppLoaded = await loadPlayerDeck(oppUid);

    if(!myLoaded || !oppLoaded){
      decksLoaded = false;
      const msg =
        "Decks could not be found in the database.\n\n" +
        "This battle page searches these locations:\n" +
        "• Decks/<userId>\n• Account/<userId>/Decks\n• Account/<userId>\n• Players/<userId>/Decks\n• Users/<userId>/Decks\n\n" +
        "Fix: tell me where your deck editor saves decks, and I’ll lock it to that one path.";
      setBanner(msg);
      document.getElementById("subLine").textContent = "Deck load failed.";
      // still listen for updates, but no battle actions
    } else {
      decksLoaded = true;
      myDeckKey = myLoaded.deckKey;
      myDeck = myLoaded.deckCards;
      oppDeckKey = oppLoaded.deckKey;
      oppDeck = oppLoaded.deckCards;
      setBanner("Decks loaded. Battle time.");
      document.getElementById("subLine").textContent = "Decks loaded.";
    }

    // ensure battle state exists
    const baseUpdates = {};
    if(typeof m.state === "undefined") baseUpdates.state = "battle";
    if(typeof m.phase === "undefined") baseUpdates.phase = "picking";
    if(typeof m.turn === "undefined") baseUpdates.turn = 1;
    if(typeof m.maxTurns === "undefined") baseUpdates.maxTurns = 10;
    if(Object.keys(baseUpdates).length) await matchRef.update(baseUpdates);

    matchRef.on("value", async (snap2) => {
      const live = snap2.val();
      if(!live) return;

      // host makes shuffles once decks are loaded
      if(decksLoaded) await ensureShuffles(live);

      // host resolves
      if(decksLoaded) await resolveIfReady(live);

      render(live);
    });
  }

  init();
</script>
</body>
</html>
